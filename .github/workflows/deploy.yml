name: Deploy

# 手动触发：GitHub 仓库页面 -> Actions -> "Deploy" -> Run workflow，勾选要发布的前端。
# GitHub 云服务器负责构建（并把环境相关的值注入进去），再用 rsync 把 dist 上传到服务器对应的目录。
# 服务器上是 nginx 直接托管这些静态文件，所以不需要重启任何容器。
#
# 需要提前在仓库 Settings -> Secrets and variables -> Actions 里配置：
#   Secrets（敏感信息）：
#     SSH_HOST         服务器地址
#     SSH_USER         前端上传专用账号 deploy-web
#                       （它的公钥在服务器上被强制命令限制成只能往网站目录写文件，不能执行别的命令）
#     SSH_PRIVATE_KEY  deploy-web 专用的私钥内容
#   Variables（不是敏感信息。注意：它们会被打包进公开的 JS，所以这里绝对不能放密钥）：
#     MINIO_ENDPOINT   浏览器访问 MinIO 的地址，如 https://xxx，不带末尾斜杠。必填
#     SITE_URL         主站地址，用于发布后的冒烟检查。可选，不填就跳过检查
#
# 本地的 .env 不提交（已加入 .gitignore），构建需要的变量全部由这个工作流在构建时传入：
#   VITE_APP_BASE_URL   固定为 /api，是和服务器 nginx 转发前缀之间的约定
#   VITE_MINIO_ENDPOINT 取自上面的 MINIO_ENDPOINT
# 两个 bucket 的名字没有传，前端代码里有默认值。

on:
  workflow_dispatch:
    inputs:
      nilo-project:
        description: '发布用户端主站 (nilo-project)'
        type: boolean
        default: true
      nilo-admin:
        description: '发布后台管理 (nilo-admin)'
        type: boolean
        default: true

# 同一时间只跑一个发布，后点的排队等前一个结束
concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把勾选了的前端拼成空格分隔的一行；一个都没勾、或者 MinIO 地址没配，直接失败，不要悄悄用错误的值打包
      - name: Pick apps
        id: pick
        env:
          PICK_PROJECT: ${{ inputs.nilo-project }}
          PICK_ADMIN: ${{ inputs.nilo-admin }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
        run: |
          apps=""
          [ "$PICK_PROJECT" = "true" ] && apps="$apps nilo-project"
          [ "$PICK_ADMIN" = "true" ] && apps="$apps nilo-admin"
          apps="${apps# }"
          if [ -z "$apps" ]; then
            echo "一个前端都没勾选" >&2
            exit 1
          fi
          if [ -z "$MINIO_ENDPOINT" ]; then
            echo "仓库 Variables 里没有配置 MINIO_ENDPOINT" >&2
            exit 1
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "本次发布：$apps"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            nilo-project/package-lock.json
            nilo-admin/package-lock.json

      # 准备 SSH 私钥。ssh-keyscan 只是记下服务器的公钥，私钥不会因此泄露给任何人
      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # 逐个构建并上传。上传目标是相对路径：服务器的强制命令已经把它限制在网站根目录里
      #   nilo-project -> www，nilo-admin -> admin
      - name: Build and upload
        env:
          APPS: ${{ steps.pick.outputs.apps }}
          MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for app in $APPS; do
            case "$app" in
              nilo-project) dir=www ;;
              nilo-admin)   dir=admin ;;
            esac
            echo "::group::构建 $app"
            (cd "$app" && npm ci && VITE_APP_BASE_URL=/api VITE_MINIO_ENDPOINT="$MINIO_ENDPOINT" npm run build)
            echo "::endgroup::"
            # --delete：把服务器上已经不存在于新版本的旧文件删掉
            rsync -az --delete --chmod=D755,F644 \
              -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
              "$app/dist/" "$SSH_USER@$SSH_HOST:$dir/"
          done

      # 发布后的冒烟检查：主站能打开，并且返回的是前端页面。同时验证了 nginx、证书和静态文件
      # 后台只允许指定 IP 访问，GitHub 云服务器访问不了，所以不检查
      - name: Smoke test
        if: ${{ vars.SITE_URL != '' && inputs.nilo-project }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl -fsS "$SITE_URL" | grep -q 'id="app"'
